name: ROS2 CI

on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'

jobs:
  test_environment:
    runs-on: [ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        # Humble only: the team runs ROS 2 Humble (AGENTS.md), so a Jazzy job adds runner
        # time without protecting anything we ship.
        ros_distribution:
          - humble
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-ros-base-latest
            ros_distribution: humble
            ros_version: 2
    container:
      image: ${{ matrix.docker_image }}
      # Public address-lookup servers for the build container (test during a DNS outage).
      options: --dns 8.8.8.8 --dns 1.1.1.1
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install libunwind (fix issues on humble)
        run: sudo apt update && sudo apt install --no-install-recommends libunwind-dev -y
      # The same Python libraries the Docker image installs (docker/Dockerfile), so
      # the driver's tests can import aiortc and wasmtime. torch comes from the
      # CPU-only index to skip several GB of CUDA libraries.
      - name: Install Python requirements
        run: |
          sudo apt install --no-install-recommends python3-pip -y
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt 'setuptools<80' 'packaging>=24.2'
      # Actions are pinned to a commit so an upstream change cannot break CI on its own.
      - name: build and test
        uses: ros-tooling/action-ros-ci@3a640b10f09b756dabe556dac5413aba369f71b0 # 0.4.8
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          vcs-repo-file-url: ""
          skip-tests: false
          # Style checks (flake8, pep257, uncrustify) are skipped for now: 7 packages fail
          # them on master. Remove this once they are cleaned up.
          colcon-defaults: |
            {
              "test": {
                "pytest-args": ["-m", "not flake8 and not pep257"],
                "ctest-args": ["-E", "uncrustify"]
              }
            }
